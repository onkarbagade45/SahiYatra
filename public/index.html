    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
    }
    .transit-glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    @keyframes laser-sweep {
      0% { top: 5%; opacity: 0.9; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #3b82f6); }
      100% { top: 90%; opacity: 0.9; }
    }
    .animate-laser {
      animation: laser-sweep 2.4s ease-in-out infinite alternate;
    }

    @keyframes steam-rise {
      0% { transform: translateY(0) scaleX(1); opacity: 0; }
      40% { opacity: 0.7; }
      100% { transform: translateY(-14px) scaleX(1.4); opacity: 0; }
    }
    .animate-steam {
      animation: steam-rise 2s ease-out infinite;
    }

    @keyframes pulse-radar {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.6); }
      70% { transform: scale(1); box-shadow: 0 0 0 14px rgba(37, 99, 235, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }
    .radar-pulse {
      animation: pulse-radar 2s infinite;
    }

    @keyframes dash-flow {
      to { stroke-dashoffset: -32; }
    }
    .animate-flow-line {
      stroke-dasharray: 8 6;
      animation: dash-flow 1.2s linear infinite;
    }

    @keyframes float-gentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float {
      animation: float-gentle 3.5s ease-in-out infinite;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>

</head>

    function InteractiveRouteSimulator() {
      const [progress, setProgress] = useState(48);
      const [isPlaying, setIsPlaying] = useState(true);
      const [speedMult, setSpeedMult] = useState(1);

      useEffect(() => {
        if (!isPlaying) return;
        const interval = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) return 0;
            return prev + (0.35 * speedMult);
          });
        }, 50);
        return () => clearInterval(interval);
      }, [isPlaying, speedMult]);

      const telemetry = useMemo(() => {
        let mode = 'Auto Rickshaw';
        let vehicle = 'MH 13 AB 1234';
        let driver = 'Ramesh Jadhav';
        let speed = 35;
        let milestone = 'Ashok Chowk ➔ Solapur Stand';
        let legIndex = 0;

        if (progress < 15) {
          mode = 'Auto Rickshaw (First-Mile)';
          vehicle = 'MH 13 AB 1234 (Auto)';
          driver = 'Ramesh Jadhav (4.7★)';
          speed = Math.round(28 + Math.sin(progress) * 8);
          milestone = 'Doorstep Auto to Solapur ST Stand';
          legIndex = 0;
        } else if (progress < 85) {
          mode = 'MSRTC Shivshahi AC Bus';
          vehicle = 'MH 13 CU 4491 (Bus)';
          driver = 'MSRTC Pilot S. More';
          legIndex = 1;

          if (progress >= 42 && progress <= 55) {
            speed = 0;
            milestone = 'Highway Halt: Hotel Jagdamba Dhaba (Indapur)';
          } else if (progress > 70 && progress < 82) {
            speed = 22;
            milestone = 'Hadapsar Bypass Congestion (+15m Buffer Active)';
          } else {
            speed = Math.round(72 + Math.sin(progress * 2) * 6);
            milestone = 'Cruising NH 65 Solapur-Pune Corridor';
          }
        } else {
          mode = 'Connecting Auto (Last-Mile)';
          vehicle = 'MH 12 PQ 7890 (Auto)';
          driver = 'Santosh Shinde (4.8★)';
          speed = Math.round(32 + Math.cos(progress) * 7);
          milestone = 'Swargate Bay #2 ➔ Hinjawadi IT Park';
          legIndex = 2;
        }

        const t = progress / 100;
        const x = 40 + t * 710;
        const y = 90 - Math.sin(t * Math.PI * 2) * 35;

        return { mode, vehicle, driver, speed, milestone, legIndex, x, y };
      }, [progress]);

      return (
        <div className="transit-glass rounded-2xl p-5 border-2 border-blue-500/40 shadow-2xl relative overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950/40">
          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-700/70">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400 radar-pulse">
                <Icon name={telemetry.legIndex === 1 ? "bus" : "car"} size={20} />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h3 className="text-sm font-extrabold text-white tracking-wide">
                    Live Highway Corridor Simulator
                  </h3>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold border border-emerald-500/30">
                    Interactive 3-Leg Flow
                  </span>
                </div>
                <p className="text-xs text-slate-300 mt-0.5">
                  Currently at: <span className="text-amber-400 font-semibold">{telemetry.milestone}</span>
                </p>
              </div>
            </div>

            <div className="flex items-center gap-1.5 bg-slate-900/90 p-1.5 rounded-xl border border-slate-700">
              <button
                onClick={() => setIsPlaying(!isPlaying)}
                className={`p-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition ${isPlaying ? 'bg-amber-600 text-white' : 'bg-blue-600 text-white'}`}
                title={isPlaying ? "Pause Simulator" : "Play Simulator"}
              >
                <Icon name={isPlaying ? "pause" : "play"} size={13} />
                <span>{isPlaying ? 'Pause' : 'Play'}</span>
              </button>

              {[1, 2, 5].map((s) => (
                <button
                  key={s}
                  onClick={() => setSpeedMult(s)}
                  className={`text-[10px] px-2 py-1 rounded-md font-bold transition ${speedMult === s ? 'bg-slate-700 text-blue-300' : 'text-slate-400 hover:text-white'}`}
                >
                  {s}x
                </button>
              ))}

              <button
                onClick={() => setProgress(0)}
                className="p-1.5 rounded-lg text-slate-400 hover:text-white transition"
                title="Rewind to start"
              >
                <Icon name="refresh" size={13} />
              </button>
            </div>
          </div>

          <div className="relative w-full h-36 bg-slate-950/70 rounded-xl border border-slate-800 p-2 overflow-hidden">
            <div className="absolute inset-0 opacity-10 bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:16px_16px]"></div>

            <svg viewBox="0 0 800 160" className="w-full h-full">
              <defs>
                <linearGradient id="corridorGlow" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor="#EA580C" />
                  <stop offset="18%" stopColor="#3B82F6" />
                  <stop offset="50%" stopColor="#F59E0B" />
                  <stop offset="85%" stopColor="#10B981" />
                  <stop offset="100%" stopColor="#3B82F6" />
                </linearGradient>
              </defs>

              <path
                d="M 40,90 Q 200,20 400,90 T 760,70"
                fill="none"
                stroke="#1E293B"
                strokeWidth="14"
                strokeLinecap="round"
              />

              <path
                d="M 40,90 Q 200,20 400,90 T 760,70"
                fill="none"
                stroke="url(#corridorGlow)"
                strokeWidth="6"
                strokeLinecap="round"
                className="animate-flow-line"
              />
