    /* Custom Scrollbar */

    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    
    /* Smooth animations */
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.98); }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2.5s ease-in-out infinite;
    }

    @keyframes heart-pop {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }
    .animate-heart-pop {
      animation: heart-pop 0.8s ease-out forwards;
    }

    @keyframes skeleton-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-box {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s infinite;
    }
    .dark .skeleton-box {
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s infinite;
    }

    /* Laser scan effect for digital ticket */
    @keyframes laser-sweep {
      0% { top: 6%; opacity: 0.9; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #3b82f6); }
      100% { top: 92%; opacity: 0.9; }
    }
    .animate-laser {
      animation: laser-sweep 2.2s ease-in-out infinite alternate;
    }

    /* Steam animation for Highway Dhaba */
    @keyframes steam-rise {
      0% { transform: translateY(0) scaleX(1); opacity: 0; }
      40% { opacity: 0.7; }
      100% { transform: translateY(-12px) scaleX(1.3); opacity: 0; }
    }
    .animate-steam {
      animation: steam-rise 2s ease-out infinite;
    }

    /* Hide scrollbars for story carousel */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

              <div className="relative w-full max-w-md rounded-3xl bg-slate-900 border border-slate-800 text-white p-6 shadow-2xl overflow-hidden">
                {/* Progress bar at top */}
                <div className="w-full h-1 bg-slate-800 rounded-full mb-4 overflow-hidden">
                  <div className="h-full bg-blue-500 animate-flow-line w-full"></div>
                </div>

                {/* Story Header */}
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2.5">
                    <div className={`w-10 h-10 rounded-xl bg-gradient-to-tr ${activeStory.gradient} flex items-center justify-center text-white`}>
                      <Icon name={activeStory.icon} size={20} />
                    </div>
                    <div>
                      <h4 className="font-extrabold text-sm text-white">
                        {lang === 'mr' ? activeStory.titleMr : activeStory.title}
                      </h4>
                      <span className="text-[11px] text-slate-400">{activeStory.subtitle}</span>
                    </div>
                  </div>
                  <button
                    onClick={() => setActiveStory(null)}
                    className="p-1.5 rounded-full hover:bg-slate-800 text-slate-400 hover:text-white"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                {/* Story Body */}
                <div className="py-5 space-y-3">
                  <h3 className="text-lg font-black text-white">
                    {lang === 'mr' ? activeStory.content.headlineMr : activeStory.content.headline}
                  </h3>
                  <p className="text-sm text-slate-300 leading-relaxed">
                    {activeStory.content.desc}
                  </p>

                  {/* Special Dhaba Menu preview if it's the Food story */}
                  {activeStory.id === 'story-food' && (
                    <div className="mt-4 space-y-2 pt-3 border-t border-slate-800">
                      <span className="text-xs font-bold text-amber-400 uppercase tracking-wider block">
                        Quick Dhaba Stop Menu (Hotel Jagdamba):
                      </span>
                      {DHABA_ITEMS.map((item) => (
                        <div key={item.id} className="p-2.5 rounded-xl bg-slate-800/80 flex items-center justify-between text-xs">
                          <div>
                            <span className="font-bold text-white">{lang === 'mr' ? item.nameMr : item.name}</span>
                            <span className="text-slate-400 block">{item.prep}</span>
                          </div>
                          <span className="font-black text-amber-400">₹{item.price}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Story Action Button */}
                <button
                  onClick={() => {
                    const id = activeStory.id;
                    setActiveStory(null);
                    if (id === 'story-cheapest') triggerReload('cheapest');
                    else if (id === 'story-fastest') triggerReload('fastest');
                    else if (id === 'story-comfort') triggerReload('comfort');
                    else if (id === 'story-safety') setActiveTab('safety');
                    else if (id === 'story-food') setActiveTab('trips');
                  }}
                  className="w-full py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm shadow-md transition"
                >
                  {activeStory.content.actionText}
                </button>
              </div>
            </div>
          )}


          {/* =========================================================================
              6. SOS EMERGENCY POPUP (Never hidden behind a gesture)
             ========================================================================= */}
          {showSosModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
              <div className="w-full max-w-sm rounded-3xl bg-slate-900 border-2 border-red-500 text-white p-6 shadow-2xl text-center space-y-4">
                <div className="w-16 h-16 rounded-full bg-red-600/20 border-2 border-red-500 flex items-center justify-center text-red-500 mx-auto animate-pulse">
                  <Icon name="phone" size={30} />
                </div>
                <div>
                  <h3 className="text-xl font-black text-white">Emergency Assistance</h3>
                  <p className="text-xs text-slate-400 mt-1">
                    Connect immediately to Maharashtra Police 112 with your real-time GPS coordinate stream.
                  </p>
                </div>

                <div className="p-3.5 rounded-2xl bg-slate-800/80 text-left text-xs space-y-1">
                  <p className="text-slate-400">Current Trip: <span className="text-white font-semibold">Solapur-Pune NH65</span></p>
                  <p className="text-slate-400">Active Vehicle: <span className="text-white font-semibold">MH 13 AB 1234</span></p>
                  <p className="text-slate-400">Driver: <span className="text-white font-semibold">Ramesh Jadhav (4.7★)</span></p>
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      alert("Connecting to Emergency Hotline 112... Live GPS dispatched.");
                      setShowSosModal(false);
                    }}
                    className="flex-1 py-3.5 rounded-2xl bg-red-600 hover:bg-red-700 text-white font-extrabold text-sm shadow-lg shadow-red-600/30 transition"
                  >
                    Call 112 Now
                  </button>
                  <button
                    onClick={() => setShowSosModal(false)}
                    className="px-4 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm transition"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
